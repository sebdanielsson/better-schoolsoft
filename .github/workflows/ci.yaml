name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Node 24 matches the version mise.toml pins for local development.
      # >=22.18 is required either way: the test script relies on the test
      # runner stripping TypeScript types without a flag.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Split into named steps so a failure names itself in the checks list,
      # matching johnson-racing-tunes and election-map-sweden.
      - name: Run format check
        run: pnpm run format:check

      - name: Run lint check
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build
