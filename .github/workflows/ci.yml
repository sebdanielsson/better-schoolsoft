name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Node 24 matches the version mise.toml pins for local development.
      # >=22.18 is required either way: the test script relies on the test
      # runner stripping TypeScript types without a flag.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # oxfmt --check, then type-aware oxlint, then tsc --noEmit.
      - run: pnpm run check

      - run: pnpm test

      - run: pnpm build
